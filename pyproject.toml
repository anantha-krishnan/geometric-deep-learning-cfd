[project]
name = "geometric-deep-learning-cfd"
version = "0.1.0"
description = "Geometric deep learning experiments for CFD"
requires-python = ">=3.13"
dependencies = [
    "h5py>=3.16.0",
    "matplotlib>=3.11.2",
    "meshio>=5.3.5",
    "numpy>=2",
    "pandas>=3.1.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "torch>=2.7",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
    "ty>=0.0.81",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
