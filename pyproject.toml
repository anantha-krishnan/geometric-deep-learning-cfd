[project]
name = "geometric-deep-learning-cfd"
version = "0.1.0"
description = "Geometric deep learning experiments for CFD"
requires-python = ">=3.13"
dependencies = [
    "h5py>=3.16.0",
    "matplotlib>=3.11.2",
    "numpy>=2",
    "pandas>=3.1.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "torch>=2.7",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
    "ty>=0.0.81",
]
